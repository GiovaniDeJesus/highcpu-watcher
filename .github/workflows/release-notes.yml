name: Sync Release Notes

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  save-release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Save release notes to file
        run: |
          mkdir -p docs/releases
          echo "# Release ${{ github.event.release.tag_name }}" > docs/releases/${{ github.event.release.tag_name }}.md
          echo "${{ github.event.release.body }}" >> docs/releases/${{ github.event.release.tag_name }}.md

      - name: Commit and push
        run: |
          git config user.name "Giovani De Jesus"
          git config user.email "giovanidejesus560@gmail.com"
          git add docs/releases/
          git commit -m "docs: add release notes for ${{ github.event.release.tag_name }}" || echo "Nothing to commit"
          git push origin main
